<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Workout</title>
<link rel="apple-touch-icon" href="icon_192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface2: #f5f5f5;
  --black: #171717;
  --gray1: #404040;
  --gray2: #737373;
  --gray3: #d4d4d4;
  --gray4: #e5e5e5;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --radius: 16px;
  --radius-xl: 20px;
}

body {
  font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  background: var(--bg);
  color: var(--black);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
}

header {
  background: var(--surface);
  padding: 52px 24px 16px;
  border-bottom: 1px solid var(--gray4);
  position: sticky; top: 0; z-index: 10;
}
.header-date { font-size: 13px; color: var(--gray2); font-weight: 500; margin-bottom: 4px; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--gray4);
  padding: 10px 0 24px;
  z-index: 20;
}
nav button {
  flex: 1; padding: 6px 8px;
  border: none; background: none;
  font-size: 10px; font-weight: 700;
  color: var(--gray3); cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  transition: all 0.2s; font-family: inherit;
  letter-spacing: 0.5px; text-transform: uppercase;
}
nav button.active { color: var(--black); }
nav button .nav-icon { font-size: 22px; line-height: 1; }

.page { display: none; padding: 20px 16px 100px; }
.page.active { display: block; }

.sec-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.8px; color: var(--gray2);
  text-transform: uppercase;
  margin-bottom: 10px; padding: 0 4px;
}

/* TODAY */
.progress-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border-radius: var(--radius-xl);
  border: 1px solid var(--gray4);
  padding: 14px 16px; margin-bottom: 20px;
}
.pill-track { flex: 1; height: 5px; background: var(--gray4); border-radius: 99px; overflow: hidden; }
.pill-fill { height: 100%; background: var(--black); border-radius: 99px; transition: width 0.4s ease; }
.pill-text { font-size: 13px; font-weight: 600; color: var(--gray2); white-space: nowrap; }
.pill-text b { color: var(--black); }

.routine-group { background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--gray4); overflow: hidden; margin-bottom: 4px; }
.routine-row {
  display: flex; align-items: center;
  padding: 16px; gap: 14px; cursor: pointer;
  border-bottom: 1px solid var(--gray4);
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.routine-row:last-child { border-bottom: none; }
.routine-row:active { background: var(--surface2); }
.routine-row.done { background: var(--surface2); }

.check-circle {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--gray3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
  font-size: 13px; color: white;
}
.routine-row.done .check-circle { background: var(--black); border-color: var(--black); }
.rname { font-size: 15px; font-weight: 500; flex: 1; }
.routine-row.done .rname { text-decoration: line-through; color: var(--gray2); }
.rdesc { font-size: 13px; color: var(--gray2); font-weight: 500; }

.extra-group { background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--gray4); overflow: hidden; margin-bottom: 8px; }
.extra-row {
  display: flex; align-items: center;
  padding: 14px 16px; gap: 10px;
  border-bottom: 1px solid var(--gray4);
}
.extra-row:last-child { border-bottom: none; }
.edot-icon { width: 7px; height: 7px; background: var(--gray3); border-radius: 50%; flex-shrink: 0; }
.extra-text { flex: 1; font-size: 15px; font-weight: 500; }
.icon-btn { background: none; border: none; color: var(--gray3); font-size: 22px; cursor: pointer; line-height: 1; padding: 0; transition: color 0.15s; }
.icon-btn:hover { color: var(--red); }

.input-row {
  display: flex; gap: 8px;
  background: var(--surface); border-radius: var(--radius-xl);
  border: 1px solid var(--gray4); padding: 10px 14px;
}
.input-row input {
  flex: 1; border: none; outline: none;
  font-size: 15px; font-family: inherit;
  background: none; color: var(--black);
}
.input-row input::placeholder { color: var(--gray3); }
.add-btn {
  background: var(--black); color: white; border: none;
  border-radius: 10px; padding: 8px 14px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: opacity 0.15s;
}
.add-btn:active { opacity: 0.7; }

.empty { text-align: center; padding: 32px 16px; color: var(--gray2); font-size: 14px; font-style: italic; border: 2px dashed var(--gray4); border-radius: var(--radius-xl); }
.empty-icon { font-size: 28px; margin-bottom: 8px; }

.photo-routine-btn {
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  opacity: 0.4; transition: opacity 0.15s;
}
.photo-routine-btn:hover { opacity: 1; }
.photo-routine-btn input { display: none; }

/* PHOTO */
.photo-section { margin-top: 24px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.photo-thumb {
  aspect-ratio: 1; border-radius: 12px;
  overflow: hidden; position: relative;
  background: var(--surface2); border: 1px solid var(--gray4);
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-thumb .photo-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.45);
  color: white; font-size: 9px; font-weight: 600;
  padding: 4px 6px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.photo-thumb .del-photo {
  position: absolute; top: 4px; right: 4px;
  background: rgba(0,0,0,0.5); color: white;
  border: none; border-radius: 50%;
  width: 20px; height: 20px; font-size: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.photo-add-btn {
  aspect-ratio: 1; border-radius: 12px;
  border: 2px dashed var(--gray4);
  background: var(--surface);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; cursor: pointer;
  font-size: 11px; color: var(--gray2); font-weight: 600;
  font-family: inherit; transition: border-color 0.15s;
}
.photo-add-btn:hover { border-color: var(--black); }
.photo-add-btn .plus { font-size: 22px; color: var(--gray3); line-height: 1; }
.photo-add-btn input { display: none; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
.cal-nav h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
.cal-arrow {
  background: var(--surface); border: 1px solid var(--gray4);
  width: 34px; height: 34px; border-radius: 50%;
  font-size: 16px; font-weight: 700; cursor: pointer; color: var(--black);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.cal-arrow:hover { background: var(--gray4); }

.cal-wrap { background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--gray4); padding: 16px; }
.cal-dh-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-dh { text-align: center; font-size: 11px; font-weight: 700; color: var(--gray2); padding: 4px 0 6px; text-transform: uppercase; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-cell {
  border-radius: 12px;
  border: 1px solid transparent;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; cursor: pointer;
  padding: 8px 2px 10px;
  min-height: 52px;
  background: var(--surface);
  transition: background 0.1s;
}
.cal-cell.empty { cursor: default; background: transparent; border-color: transparent; }
.cal-cell:not(.empty) { border-color: var(--gray4); }
.cal-cell:not(.empty):active { background: var(--surface2); }
.cal-cell.today { border-color: var(--black) !important; }
.dnum { font-size: 13px; font-weight: 600; line-height: 1; }
.cal-cell.today .dnum { font-weight: 700; }
.dmark { font-size: 12px; font-weight: 800; line-height: 1; margin-top: 3px; }
.dmark.o { color: var(--black); }
.dmark.x { color: var(--gray2); }
.edot { width: 4px; height: 4px; background: var(--gray2); border-radius: 50%; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); }

/* ROUTINE EDITOR */
.seg-ctrl { display: flex; background: var(--gray4); border-radius: 12px; padding: 3px; margin-bottom: 20px; }
.seg-btn { flex: 1; padding: 8px; border: none; border-radius: 10px; background: none; font-size: 13px; font-weight: 600; color: var(--gray2); cursor: pointer; font-family: inherit; transition: all 0.2s; }
.seg-btn.active { background: var(--surface); color: var(--black); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

.day-scroll { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
.day-scroll::-webkit-scrollbar { display: none; }
.day-chip { flex-shrink: 0; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--gray4); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--gray2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.day-chip.active { background: var(--black); color: white; border-color: var(--black); }

.edit-group { background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--gray4); overflow: hidden; margin-bottom: 8px; }
.edit-row { display: flex; align-items: center; padding: 12px 16px; gap: 10px; border-bottom: 1px solid var(--gray4); }
.edit-row:last-child { border-bottom: none; }
.edit-name { flex: 1; border: none; outline: none; font-size: 15px; font-weight: 500; font-family: inherit; background: none; color: var(--black); min-width: 0; }
.edit-reps { width: 48px; border: 1px solid var(--gray4); border-radius: 8px; padding: 5px 6px; font-size: 13px; font-weight: 600; text-align: center; font-family: inherit; outline: none; background: var(--surface2); }
.edit-reps:focus { border-color: var(--black); }
.edit-unit { border: 1px solid var(--gray4); border-radius: 8px; padding: 5px 6px; font-size: 13px; font-weight: 600; font-family: inherit; outline: none; background: var(--surface2); }
.edit-unit:focus { border-color: var(--black); }

.add-input-row { display: flex; gap: 8px; background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--gray4); padding: 12px 16px; }
.add-input-row input { flex: 1; border: none; outline: none; font-size: 15px; font-family: inherit; background: none; color: var(--black); }
.add-input-row input::placeholder { color: var(--gray3); }
.add-small-btn { background: var(--surface2); color: var(--black); border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
.add-small-btn:active { background: var(--gray4); }

.save-bar {
  position: fixed; bottom: 0; left: 50%;
  transform: translateX(-50%); width: 100%; max-width: 430px;
  background: rgba(250,250,250,0.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 12px 16px 88px; border-top: 1px solid var(--gray4);
}
.save-bar-btn {
  width: 100%; background: var(--black); color: white; border: none;
  border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.save-bar-btn:active { opacity: 0.7; }
.save-bar-btn.saved { background: #404040; }
</style>
</head>
<body>

<header>
  <div class="header-title">Simple Workout</div>
</header>

<nav>
  <button onclick="showPage('today')">
    <span class="nav-icon">✓</span>오늘
  </button>
  <button class="active" onclick="showPage('calendar')">
    <span class="nav-icon">◫</span>기록
  </button>
  <button onclick="showPage('routine')">
    <span class="nav-icon">⚙</span>설정
  </button>
</nav>

<div class="page" id="page-today">
  <div class="progress-pill" id="prog-pill" style="display:none">
    <div class="pill-track"><div class="pill-fill" id="pill-fill" style="width:0%"></div></div>
    <div class="pill-text" id="pill-text"></div>
  </div>
  <div class="sec-label">오늘의 루틴</div>
  <div id="today-list"></div>
  <div class="sec-label" style="margin-top:24px">추가 운동</div>
  <div id="extra-group"></div>
  <div class="input-row" style="margin-top:8px">
    <input type="text" id="extra-input" placeholder="추가로 한 운동 입력..." />
    <button class="add-btn" onclick="addExtra()">추가</button>
  </div>
  <div class="photo-section">
    <div class="sec-label">운동 사진</div>
    <div class="photo-grid" id="photo-grid"></div>
  </div>
</div>

<div class="page active" id="page-calendar">
  <div class="cal-nav">
    <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
    <h2 id="cal-title"></h2>
    <button class="cal-arrow" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-wrap">
    <div class="cal-dh-row" id="cal-dh-row"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

</div>

<div class="page" id="page-routine">
  <div class="sec-label">루틴 모드</div>
  <div class="seg-ctrl">
    <button class="seg-btn active" id="seg-daily" onclick="setMode('daily')">매일 동일</button>
    <button class="seg-btn" id="seg-weekly" onclick="setMode('weekly')">요일별 설정</button>
  </div>
  <div id="day-scroll-wrap" style="display:none">
    <div class="day-scroll" id="day-scroll"></div>
  </div>
  <div class="sec-label" id="edit-label">루틴</div>
  <div id="edit-group"></div>
  <div class="add-input-row" style="margin-top:8px">
    <input type="text" id="new-input" placeholder="운동 이름 입력..." />
    <button class="add-small-btn" onclick="addItem()">+ 추가</button>
  </div>
  <div style="height:90px"></div>
  <div class="save-bar">
    <button class="save-bar-btn" id="save-btn" onclick="saveRoutine()">저장하기</button>
  </div>
</div>

<script>
const DAYS = ['일','월','화','수','목','금','토'];
const today = new Date();
const todayKey = dk(today);
let state = load();

function defaultState() {
  return {
    mode: 'daily',
    routines: {
      daily: [{id:1,name:'줄넘기',reps:50,unit:'회'},{id:2,name:'팔굽혀펴기',reps:10,unit:'회'}],
      weekly: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]}
    },
    logs: {}
  };
}
function load() { try { const s=localStorage.getItem('ex_v3'); return s?JSON.parse(s):defaultState(); } catch { return defaultState(); } }
function saveS() { localStorage.setItem('ex_v3', JSON.stringify(state)); }
function dk(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function getLog(k) { if(!state.logs[k]) state.logs[k]={checked:[],extra:[]}; return state.logs[k]; }
function getTodayRoutine() { return state.mode==='daily' ? state.routines.daily : (state.routines.weekly[today.getDay()]||[]); }

function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['today','calendar','routine'][i]===name));
  document.getElementById(`page-${name}`).classList.add('active');
  if(name==='today') renderToday();
  if(name==='calendar') renderCalendar();
  if(name==='routine') renderEditor();
}

function renderToday() {
  const routines=getTodayRoutine(), log=getLog(todayKey);
  const done=routines.filter(r=>log.checked.includes(r.id)).length, total=routines.length;
  const pill=document.getElementById('prog-pill');
  if(total>0) {
    pill.style.display='flex';
    document.getElementById('pill-fill').style.width=`${(done/total)*100}%`;
    document.getElementById('pill-text').innerHTML=`<b>${done}</b> / ${total}`;
  } else { pill.style.display='none'; }

  const el=document.getElementById('today-list');
  if(!routines.length) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div>루틴을 먼저 설정해주세요</div>`;
  } else {
    el.innerHTML=`<div class="routine-group">${routines.map(r=>{
      const isDone=log.checked.includes(r.id);
      return `<div class="routine-row ${isDone?'done':''}" onclick="toggleCheck(${r.id})">
        <div class="check-circle">${isDone?'✓':''}</div>
        <div class="rname">${r.name}</div>
        <div class="rdesc">${r.reps} ${r.unit}</div>
        <label class="photo-routine-btn" onclick="event.stopPropagation()" title="사진 추가">
          📷<input type="file" accept="image/*" multiple onchange="addRoutinePhoto(event,${r.id},'${r.name}')">
        </label>
      </div>`;
    }).join('')}</div>`;
  }
  renderExtraList();
  renderPhotoGrid();
}

function addRoutinePhoto(e, id, name) {
  const log=getLog(todayKey);
  if(!log.photos) log.photos=[];
  const files=Array.from(e.target.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      log.photos.push({id, name, src: ev.target.result});
      loaded++;
      if(loaded===files.length){ saveS(); renderPhotoGrid(); }
    };
    reader.readAsDataURL(file);
  });
}

function removePhoto(i) {
  const log=getLog(todayKey);
  log.photos.splice(i,1);
  saveS(); renderPhotoGrid();
}

function renderPhotoGrid() {
  const log=getLog(todayKey);
  const grid=document.getElementById('photo-grid');
  const photos=log.photos||[];
  let html=photos.map((p,i)=>`
    <div class="photo-thumb">
      <img src="${p.src}" />
      <div class="photo-label">${p.name}</div>
      <button class="del-photo" onclick="removePhoto(${i})">×</button>
    </div>`).join('');
  html+=`<label class="photo-add-btn">
    <span class="plus">+</span>
    <span>사진 추가</span>
    <input type="file" accept="image/*" multiple onchange="addPhotoGeneral(event)">
  </label>`;
  grid.innerHTML=html;
}

function addPhotoGeneral(e) {
  const log=getLog(todayKey);
  if(!log.photos) log.photos=[];
  const files=Array.from(e.target.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      log.photos.push({id:null, name:'기타', src: ev.target.result});
      loaded++;
      if(loaded===files.length){ saveS(); renderPhotoGrid(); }
    };
    reader.readAsDataURL(file);
  });
}

function toggleCheck(id) { const log=getLog(todayKey),i=log.checked.indexOf(id); if(i===-1)log.checked.push(id);else log.checked.splice(i,1); saveS();renderToday(); }

function renderExtraList() {
  const log=getLog(todayKey), el=document.getElementById('extra-group');
  if(!log.extra.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="extra-group">${log.extra.map((e,i)=>`<div class="extra-row"><div class="edot-icon"></div><div class="extra-text">${e}</div><button class="icon-btn" onclick="removeExtra(${i})">×</button></div>`).join('')}</div>`;
}

function addExtra() { const inp=document.getElementById('extra-input'),v=inp.value.trim();if(!v)return;getLog(todayKey).extra.push(v);inp.value='';saveS();renderExtraList(); }
function removeExtra(i) { getLog(todayKey).extra.splice(i,1);saveS();renderExtraList(); }

let calY=today.getFullYear(), calM=today.getMonth();
function changeMonth(d) { calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-title').textContent=`${calY}년 ${calM+1}월`;
  document.getElementById('cal-dh-row').innerHTML=DAYS.map(d=>`<div class="cal-dh">${d}</div>`).join('');
  const grid=document.getElementById('cal-grid');
  let html='';
  const first=new Date(calY,calM,1).getDay(), last=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<first;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=last;d++) {
    const key=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=key===todayKey, log=state.logs[key];
    let routine=state.mode==='daily'?state.routines.daily:(state.routines.weekly[new Date(calY,calM,d).getDay()]||[]);
    let mark='';
    if(log&&routine.length>0){ if(routine.every(r=>log.checked.includes(r.id))) mark=`<div class="dmark o">O</div>`; else if(key<=todayKey) mark=`<div class="dmark x">X</div>`; }
    else if(routine.length>0&&key<todayKey) mark=`<div class="dmark x">X</div>`;
    const edot=log&&log.extra&&log.extra.length?`<div class="edot"></div>`:'';
    html+=`<div class="cal-cell ${isToday?'today':''}"><div class="dnum">${d}</div>${mark}${edot}</div>`;
  }
  grid.innerHTML=html;
}

let eMode, eDay=0, eRoutines;
function renderEditor() { eMode=state.mode; eRoutines=JSON.parse(JSON.stringify(state.routines)); document.getElementById('seg-daily').classList.toggle('active',eMode==='daily'); document.getElementById('seg-weekly').classList.toggle('active',eMode==='weekly'); renderDayScroll();renderEditGroup(); }
function setMode(m) { eMode=m; document.getElementById('seg-daily').classList.toggle('active',m==='daily'); document.getElementById('seg-weekly').classList.toggle('active',m==='weekly'); renderDayScroll();renderEditGroup(); }
function renderDayScroll() {
  const wrap=document.getElementById('day-scroll-wrap');
  document.getElementById('edit-label').textContent=eMode==='daily'?'루틴':`${DAYS[eDay]}요일 루틴`;
  if(eMode==='daily'){wrap.style.display='none';}
  else{wrap.style.display='block';document.getElementById('day-scroll').innerHTML=DAYS.map((d,i)=>`<button class="day-chip ${i===eDay?'active':''}" onclick="selDay(${i})">${d}</button>`).join('');}
}
function selDay(i){eDay=i;renderDayScroll();renderEditGroup();}
function curList(){return eMode==='daily'?eRoutines.daily:eRoutines.weekly[eDay];}
function renderEditGroup(){
  const list=curList(),el=document.getElementById('edit-group');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-icon">➕</div>운동을 추가해보세요</div>`;return;}
  el.innerHTML=`<div class="edit-group">${list.map((r,i)=>`<div class="edit-row"><input class="edit-name" type="text" value="${r.name}" onchange="updItem(${i},'name',this.value)"/><input class="edit-reps" type="number" value="${r.reps}" min="1" onchange="updItem(${i},'reps',+this.value)"/><select class="edit-unit" onchange="updItem(${i},'unit',this.value)">${['회','분','세트','km'].map(u=>`<option ${r.unit===u?'selected':''}>${u}</option>`).join('')}</select><button class="icon-btn" onclick="delItem(${i})">×</button></div>`).join('')}</div>`;
}
function updItem(i,f,v){curList()[i][f]=v;}
function delItem(i){curList().splice(i,1);renderEditGroup();}
let nextId=Date.now();
function addItem(){const inp=document.getElementById('new-input'),name=inp.value.trim();if(!name)return;curList().push({id:nextId++,name,reps:10,unit:'회'});inp.value='';renderEditGroup();}
function saveRoutine(){
  state.mode=eMode;state.routines=eRoutines;saveS();
  const btn=document.getElementById('save-btn');
  btn.textContent='저장됐어요 ✓';btn.classList.add('saved');
  setTimeout(()=>{btn.textContent='저장하기';btn.classList.remove('saved');},1600);
}

renderToday();
showPage('calendar');
</script>
